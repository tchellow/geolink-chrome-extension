<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 440px; height: 280px; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  .tile { position: relative; width: 440px; height: 280px; background: linear-gradient(135deg, #0a3a8c 0%, #1a73e8 100%); }
  svg { position: absolute; inset: 0; }
  .marca { position: absolute; left: 24px; top: 22px; display: flex; align-items: center; gap: 12px; }
  .marca img { width: 58px; height: 58px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }
  .nome { color: #fff; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
  .frase { position: absolute; left: 26px; top: 92px; color: #e3edff; font-size: 17px; font-weight: 500; line-height: 1.3; }
</style>
</head>
<body>
<div class="tile">
  <svg width="440" height="280" viewBox="0 0 440 280">
    <defs>
      <linearGradient id="frente" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8fd16a"/>
        <stop offset="1" stop-color="#3f8f3a"/>
      </linearGradient>
    </defs>

    <!-- serra ao fundo -->
    <path d="M0,232 C40,214 70,222 110,206 C150,190 175,214 215,204 C255,194 280,170 320,184 C360,198 395,176 440,186 L440,280 L0,280 Z"
          fill="#0b2f6e" opacity="0.55"/>

    <!-- zona de Fresnel -->
    <ellipse cx="226" cy="160" rx="166" ry="20" transform="rotate(-2.4 226 160)"
             fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.55)" stroke-width="1.3" stroke-dasharray="5 4"/>

    <!-- relevo principal -->
    <path d="M0,250 C20,236 40,214 62,206 C80,200 92,212 112,226 C140,246 170,250 200,236 C222,226 236,214 256,222
             C282,232 300,246 330,232 C350,222 368,198 392,190 C410,186 426,196 440,206 L440,280 L0,280 Z"
          fill="url(#frente)"/>

    <!-- antenas -->
    <line x1="60" y1="206" x2="60" y2="167" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="392" y1="190" x2="392" y2="153" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

    <!-- linha de visada -->
    <line x1="60" y1="167" x2="392" y2="153" stroke="#ea4335" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="167" r="7" fill="#ea4335" stroke="#fff" stroke-width="2.5"/>
    <circle cx="392" cy="153" r="7" fill="#ea4335" stroke="#fff" stroke-width="2.5"/>
    <text x="48" y="157" text-anchor="end" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">A</text>
    <text x="404" y="143" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#fff">B</text>
  </svg>

  <div class="marca">
    <img src="../icon128.png" alt="">
    <span class="nome">GeoLink</span>
  </div>
  <div class="frase">Visada e coordenadas<br>no Google Maps</div>
</div>
</body>
</html>
