<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Coordenadas para Mapa</title>
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      width: 260px;
      padding: 14px;
      margin: 0;
      background: #f7f7f8;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #222;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #1558b0;
    }
    button:disabled {
      background: #c8c8c8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      word-break: break-word;
    }
    #status.error {
      color: #c5221f;
    }
  </style>
</head>
<body>
  <h1 id="headingClipboard">Verificando área de transferência...</h1>
  <button id="btn" disabled>Abrir Mapa Topográfico</button>

  <h1 id="headingTopo" style="margin-top:16px;">De Topográfico para Google Maps</h1>
  <button id="btnFromTopo" disabled>Abrir esta localização no Google Maps</button>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
